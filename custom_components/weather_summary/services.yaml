generate:
  name: Generate weather sentence
  description: "Generates a short weather sentence from a prompt using the configured LLM. Use it from the Android app or scripts."
  fields:
    prompt:
      name: Prompt
      description: "The prompt containing the weather facts (same recipe as the Android app)."
      required: true
      example: "Facts: current: 28.1°, raining_now: false, rain_start_in_min: 20 ..."
      selector:
        text:
          multiline: true
    mode:
      name: Mode
      description: "Sentence length: tiny (≤ 60 chars), short (≤ 100 chars), long (≤ 240 chars)."
      default: short
      selector:
        select:
          custom_value: false
          options:
            - label: Tiny (≤ 60 chars)
              value: tiny
            - label: Short (≤ 100 chars)
              value: short
            - label: Long (≤ 240 chars)
              value: long

ingest_app:
  name: Ingest app data
  description: "Adopt weather data + sentence pushed from the Android app, keeping the sensors fresh without polling."
  fields:
    payload:
      name: Payload
      description: "Weather and summary key-value pairs from the phone (temperature, summary, weather_code, is_raining, rain_start_in_min, ...)."
      required: true
      selector:
        object:
          multiple: false