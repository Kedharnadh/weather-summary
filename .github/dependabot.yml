version: 2
updates:
  - package-ecosystem: npm
    directory: /pwa
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      build-tooling:
        patterns:
          - vite
          - "@vitejs/plugin-react"
          - vitest
          - typescript
          - vite-plugin-pwa
          - sharp

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
